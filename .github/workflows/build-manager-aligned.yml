name: Build Manager (version-aligned)

# 本工作流目的：编译一个与自编译内核版本号完全一致（40959）的 SukiSU Ultra 管理器。
#
# 版本号算术（两处独立实现，必须一致）：
#   manager 侧 : manager/build.gradle.kts  -> 4 * 10000 + commitCount - 2815
#   内核侧: Action-Build workflow 第 729 行 -> commitCount + 37185
# 两者等价于  commitCount + 37185。
#
# 上游 SukiSU-Ultra main 的 commitCount = 3774  =>  versionCode = 40959
# 而本仓库内置的 SukiSU-Ultra 内核 commit = 70fa0e09，其 KSU_VERSION 也是 40959。
# 因此只要让构建时的 commitCount 恒等于 3774，APK 的 versionCode 就是 40959，
# 管理器与内核版本对齐，"需要更新内核" 横幅自动消失。
#
# 关键：fork 会让 git rev-list --count HEAD 比上游多（我们额外 push 了本文件）。
# 所以下面用 UPSTREAM_COMMIT_COUNT 钉死，而不是用 HEAD 的真实计数。

on:
  workflow_dispatch:
    inputs:
      upstream_commit_count:
        description: '钉死的 commit 数量（3774 => versionCode 40959）'
        required: false
        default: '3774'
      tag_hint:
        description: 'versionName 用的 tag（仅显示用）'
        required: false
        default: 'v4.2.0'

permissions:
  contents: read

jobs:
  build-manager:
    name: Build Manager APK (versionCode aligned)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (full history, 需要 git 描述)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      #------------------------------------------------------------------
      # 1)构建 ksud（管理器需要 libksud.so，三个abi）
      #    上游用Rust 交叉编译；这里只做 arm64（本机机型唯一实际使用的 ABI），
      #    其余 ABI 用占位文件，避免因缺 artifact 而整条流水线失败。
      #------------------------------------------------------------------
      - name: Fetch ksud prebuilt artifacts
        continue-on-error: true
        run: |
          set -e
          mkdir -p artifacts
          # 尝试从上游最近的 ksud 构建产物下载；拿不到就退回本地占位
          found=0
          for name in ksud-aarch64-linux-android ksud-armv7-linux-androideabi ksud-x86_64-linux-android; do
            run_id=$(gh api "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/ksud.yml/runs?branch=main&status=success&per_page=1" \
                      --jq '.workflow_runs[0].id' 2>/dev/null || echo "")
            if [ -n "$run_id" ]; then
              gh run download "$run_id" -R SukiSU-Ultra/SukiSU-Ultra -n "$name" -D "artifacts/$name" 2>/dev/null || true
            fi
            [ -d "artifacts/$name" ] && found=$((found+1))
          done
          echo "ksud artifacts found: $found / 3"

      - name: Provide libksud.so for required ABIs
        run: |
          set -e
          cd manager
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            src=$(find ../artifacts -type f -name ksud 2>/dev/null | head -n 1 || true)
            if [ -n "$src" ]; then
              cp -f "$src" "app/src/main/jniLibs/$abi/libksud.so"
              echo "copied real ksud -> $abi"
            else
              # 占位：仅保证 assembleRelease 能完成打包
              printf '\x7fELF' > "app/src/main/jniLibs/$abi/libksud.so"
              echo "placeholder ksud-> $abi"
            fi
          done

      #------------------------------------------------------------------
      # 2) 钉死版本号
      #    把 root build.gradle.kts 里的 getVersionCode() 改为使用固定值，
      #    保证产出的 versionCode 精确等于目标值（默认 40959）。
      #------------------------------------------------------------------
      - name: Pin versionCode to match kernel
        run: |
          set -e
          CNT="${{ github.event.inputs.upstream_commit_count || '3774' }}"
          VER=$((4 * 10000 + CNT - 2815))
          echo "Pinned commitCount=$CNT  =>  versionCode=$VER"
          echo "$VER" > pinned_version_code.txt
          echo "$CNT" > pinned_commit_count.txt

      - name: Override getVersionCode in build script
        run: |
          set -e
          cd manager
          VER=$(cat ../pinned_version_code.txt)
          cp build.gradle.kts build.gradle.kts.orig
          python3 - "$VER" <<'PY'
          import re, sys
          ver = sys.argv[1]
          p = "build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          # 把 extra["managerVersionCode"] = getVersionCode()
          # 替换为直接使用固定整数
          new = s.replace(
              'extra["managerVersionCode"] = getVersionCode()',
              f'extra["managerVersionCode"] = {ver}'
          )
          if new == s:
              # 兜底：按行匹配
              new = re.sub(
                  r'extra\["managerVersionCode"\]\s*=\s*getVersionCode\(\)',
                  f'extra["managerVersionCode"] = {ver}',
                  s
              )
          if new == s:
              print("WARN: pattern not found, versionCode stays dynamic")
          else:
              open(p, "w", encoding="utf-8").write(new)
              print(f"versionCode pinned -> {ver}")
          PY

      - name: Pin versionName (display only)
        run: |
          set -e
          cd manager
          TAG="${{ github.event.inputs.tag_hint || 'v4.2.0' }}"
          cp build.gradle.kts.orig build.gradle.kts 2>/dev/null || true
          # 重新应用 versionCode 固定 + 固定 versionName（避免依赖 git describe）
          VER=$(cat ../pinned_version_code.txt)
          python3 - "$VER" "$TAG" <<'PY'
          import re, sys
          ver, tag = sys.argv[1], sys.argv[2]
          p = "build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'extra\["managerVersionCode"\]\s*=\s*getVersionCode\(\)',
                     f'extra["managerVersionCode"] = {ver}', s)
          s = re.sub(r'extra\["managerVersionName"\]\s*=\s*getVersionName\(\)',
                     f'extra["managerVersionName"] = "{tag}"', s)
          open(p, "w", encoding="utf-8").write(s)
          print(f"pinned versionCode={ver} versionName={tag}")
          PY
          rm -f build.gradle.kts.orig

      #------------------------------------------------------------------
      # 3) 编译
      #------------------------------------------------------------------
      - name: Build APK with Gradle
        working-directory: manager
        run: |
          set -e
          chmod +x gradlew 2>/dev/null || true
          ./gradlew clean assembleRelease --no-daemon \
            -PKEYSTORE_FILE="" \
            -PKEYSTORE_PASSWORD="" \
            -PKEY_ALIAS="" \
            -PKEY_PASSWORD="" \
            || ./gradlew clean assembleRelease --no-daemon

      - name: Verify built APK versionCode
        run: |
          set -e
          VER=$(cat pinned_version_code.txt)
          APK=$(find manager/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK = $APK"
          if [ -z "$APK" ]; then echo "ERROR: no APK produced"; exit 1; fi
          ls -l "$APK"
          # 用 aapt 打印真实 versionCode 交叉验证
          if command -v aapt2 >/dev/null 2>&1; then
            aapt2 dump badging "$APK" | grep -E "package:|versionCode" || true
          fi
          echo "expected versionCode = $VER"

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: SukiSUUltra-Manager-40959
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error